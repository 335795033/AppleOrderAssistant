<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Adzapple助手 激活码生成器</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #16171d; color: #e6e6e6;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  .card {
    background: #20222b; border: 1px solid #343748; border-radius: 16px;
    padding: 32px; width: 100%; max-width: 560px; box-shadow: 0 12px 40px rgba(0,0,0,.4);
  }
  h1 { font-size: 20px; margin-bottom: 6px; }
  .sub { font-size: 12px; color: #9a9fb0; margin-bottom: 24px; line-height: 1.6; }
  label { display: block; font-size: 13px; color: #c3c7d4; margin-bottom: 8px; }
  input[type="date"], input[type="text"] {
    width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid #3a3d4f;
    background: #16171d; color: #e6e6e6; font-size: 15px; outline: none;
  }
  input[type="text"] { font-family: "SF Mono", Consolas, monospace; letter-spacing: 1px; text-transform: uppercase; }
  .row { display: flex; gap: 12px; margin-top: 12px; }
  button {
    flex: 1; padding: 10px 0; border: 0; border-radius: 8px; font-size: 15px; cursor: pointer;
  }
  .primary { background: #5b6cff; color: #fff; }
  .primary:hover { background: #6f7dff; }
  .ghost { background: transparent; color: #9a9fb0; border: 1px solid #3a3d4f; }
  .ghost:hover { color: #e6e6e6; }
  .output-wrap { margin-top: 20px; display: none; }
  .output {
    background: #16171d; border: 1px dashed #4a4e63; border-radius: 10px;
    padding: 14px; font-size: 15px; letter-spacing: 1px; word-break: break-all;
    color: #8df0b0; font-family: "SF Mono", Consolas, monospace; text-align: center;
  }
  .tip { font-size: 12px; color: #9a9fb0; margin-top: 10px; line-height: 1.7; }
  .error { color: #ff7a7a; font-size: 13px; margin-top: 10px; display: none; }
</style>
</head>
<body>
<div class="card">
  <h1>Adzapple助手 激活码生成器</h1>
  <p class="sub">本地生成，无需联网。<br/>激活码为 <b>IPO-到期日期-设备码-随机盐-签名</b> 格式（SHA-256 签名，每次生成结果不同），到期日当天 23:59:59 前有效。<br/>激活码与设备码绑定：<b>一个激活码只能在一台电脑/浏览器上使用一次</b>，无法多设备共用。</p>

  <label for="deviceId">设备码（让使用方打开扩展弹窗复制「本机设备码」发给你）</label>
  <input type="text" id="deviceId" maxlength="32" placeholder="如 3FA9C2D41B0E5786，共 16 位" autocomplete="off" spellcheck="false" />

  <label for="expiry" style="margin-top:16px">选择到期日期（当天有效）</label>
  <input type="date" id="expiry" />
  <div class="row">
    <button class="primary" onclick="generate()">生成激活码</button>
    <button class="ghost" onclick="copyCode()">复制</button>
  </div>

  <div class="output-wrap" id="outputWrap">
    <div class="output" id="output"></div>
    <div class="error" id="error"></div>
    <p class="tip">提示：让使用方在扩展弹窗复制「本机设备码」发给你 → 填入设备码与到期日期生成激活码发给对方。<br/>激活码只能在该设备码对应的电脑上激活（该电脑所有浏览器通用）；到期前再次开启无需重复输入，到期后需重新生成并激活。<br/>注意：旧版（IPO-日期-盐-签名 4 段、无设备码）激活码已全部失效，请使用本生成器重新生成。</p>
  </div>
</div>

<script>
  // 必须与扩展内 ACTIVATION_SECRET 完全一致
  var SECRET = 'SZzh@ng-Apple#2026#vN8wK2xQ7mR4tL9pZ3fJ6bH5cY1dG0sA';
  var PREFIX = 'IPO';
  var SALT_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';

  // 纯 JS SHA-256（与扩展内 app/shared/activation.ts 实现一致）
  var SHA256_K = new Uint32Array([
    0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5,
    0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3, 0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174,
    0xe49b69c1, 0xefbe4786, 0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da,
    0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967,
    0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13, 0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85,
    0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070,
    0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3,
    0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208, 0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2
  ]);

  function rotr(x, n) { return ((x >>> n) | (x << (32 - n))) >>> 0; }

  function sha256Hex(input) {
    var data = new TextEncoder().encode(input);
    var bitLen = data.length * 8;
    var padded = Array.prototype.slice.call(data);
    padded.push(0x80);
    while (padded.length % 64 !== 56) padded.push(0);
    for (var i = 7; i >= 0; i--) padded.push((bitLen / Math.pow(2, i * 8)) & 0xff);

    var H = new Uint32Array([0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a, 0x510e527f, 0x9b05688c, 0x1f83d9ab, 0x5be0cd19]);
    var w = new Uint32Array(64);

    for (var off = 0; off < padded.length; off += 64) {
      for (var t = 0; t < 16; t++) {
        var j = off + t * 4;
        w[t] = ((padded[j] << 24) | (padded[j + 1] << 16) | (padded[j + 2] << 8) | padded[j + 3]) >>> 0;
      }
      for (var t2 = 16; t2 < 64; t2++) {
        var s0 = rotr(w[t2 - 15], 7) ^ rotr(w[t2 - 15], 18) ^ (w[t2 - 15] >>> 3);
        var s1 = rotr(w[t2 - 2], 17) ^ rotr(w[t2 - 2], 19) ^ (w[t2 - 2] >>> 10);
        w[t2] = (w[t2 - 16] + s0 + w[t2 - 7] + s1) >>> 0;
      }
      var a = H[0], b = H[1], c = H[2], d = H[3], e = H[4], f = H[5], g = H[6], h = H[7];
      for (var k = 0; k < 64; k++) {
        var S1 = rotr(e, 6) ^ rotr(e, 11) ^ rotr(e, 25);
        var ch = (e & f) ^ (~e & g);
        var t1 = (h + S1 + ch + SHA256_K[k] + w[k]) >>> 0;
        var S0 = rotr(a, 2) ^ rotr(a, 13) ^ rotr(a, 22);
        var maj = (a & b) ^ (a & c) ^ (b & c);
        var t2b = (S0 + maj) >>> 0;
        h = g; g = f; f = e;
        e = (d + t1) >>> 0;
        d = c; c = b; b = a;
        a = (t1 + t2b) >>> 0;
      }
      H[0] = (H[0] + a) >>> 0; H[1] = (H[1] + b) >>> 0; H[2] = (H[2] + c) >>> 0; H[3] = (H[3] + d) >>> 0;
      H[4] = (H[4] + e) >>> 0; H[5] = (H[5] + f) >>> 0; H[6] = (H[6] + g) >>> 0; H[7] = (H[7] + h) >>> 0;
    }
    var hex = '';
    for (var m = 0; m < 8; m++) hex += H[m].toString(16).padStart(8, '0');
    return hex;
  }

  function makeSalt() {
    var salt = '';
    for (var i = 0; i < 8; i++) salt += SALT_CHARS[Math.floor(Math.random() * SALT_CHARS.length)];
    return salt;
  }

  function signature(expiry8, deviceId, salt) {
    return sha256Hex(SECRET + '|' + expiry8 + '|' + deviceId + '|' + salt).slice(0, 32).toUpperCase();
  }

  function to8(dateStr) {
    return dateStr.replace(/-/g, ''); // yyyy-mm-dd -> yyyymmdd
  }

  // 归一化设备码：去掉空白/连字符等无关字符并转大写；非法返回空串（与扩展内 normalizeDeviceId 一致）
  function normalizeDevice(raw) {
    var id = String(raw || '').replace(/[^0-9a-zA-Z]/g, '').toUpperCase();
    return /^[0-9A-F]{16}$/.test(id) ? id : '';
  }

  function generate() {
    var input = document.getElementById('expiry');
    var wrap = document.getElementById('outputWrap');
    var out = document.getElementById('output');
    var err = document.getElementById('error');
    err.style.display = 'none';
    err.style.color = '';
    var device = normalizeDevice(document.getElementById('deviceId').value);
    if (!device) {
      err.textContent = '请先填写 16 位设备码（让使用方在扩展弹窗复制「本机设备码」发给你）';
      err.style.display = 'block';
      return;
    }
    if (!input.value) {
      err.textContent = '请先选择到期日期';
      err.style.display = 'block';
      return;
    }
    var expiry = to8(input.value);
    var salt = makeSalt();
    var code = PREFIX + '-' + expiry + '-' + device + '-' + salt + '-' + signature(expiry, device, salt);
    out.textContent = code;
    wrap.style.display = 'block';
  }

  function copyCode() {
    var out = document.getElementById('output');
    var err = document.getElementById('error');
    if (!out.textContent) return;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(out.textContent).then(function () {
        err.textContent = '已复制到剪贴板';
        err.style.display = 'block';
        err.style.color = '#8df0b0';
      });
    } else {
      err.textContent = '复制失败，请手动选中复制';
      err.style.display = 'block';
    }
  }
</script>
</body>
</html>
